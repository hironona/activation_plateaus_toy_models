model:
  input_dim: 2
  output_dim: 1 # for classification, this should match num_classes. When num_classes=2, we can use output_dim=1 with sigmoid activation. For num_classes>2, use output_dim=num_classes with softmax.
  hidden_dim: 16
  resblock_width: 16
  num_blocks: 10
  dropout: 0.0

training:
  batch_size: 64
  learning_rate: 1e-4
  weight_decay: 0.01
  epochs: 200
  save_every: 100
  seed: 0     # First seed; seeds seed, seed+1, ..., seed+n_seeds-1 are trained
  n_seeds: 5
  # Checkpoints go to {checkpoint_root}/{task.name}/noise-{task.noise_std}[-{run_tag}]/seed-{k}/
  checkpoint_root: "checkpoints"
  run_tag: null  # Optional suffix to tell apart runs with the same task and noise, e.g. "epoch500"
  val_split: 0.1 # fraction of data used for validation
  lr_scheduler: "cosine" # Options: "cosine", "none"

task:
  name: "class_spiral" # Options: "reg_sine_wave", "class_spiral"
  num_samples: 20000
  noise_std: 0.00
  num_classes: 2
  distribution: "normal" # Options: "uniform", "normal"
  shuffle_per_epoch: True
