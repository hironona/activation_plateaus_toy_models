# Configuration for the interpolation analyses of the toy ResNet

n_steps: 50

# Run directory (checkpoints/{task}/noise-{std}); the final-epoch checkpoint of every seed-* in it is used
checkpoint_dir: "checkpoints/class_spiral/noise-0.00"

# Layer whose activations the plots read: -2 = input, -1 = embed, 0+ = residual blocks
layer_to_interpolate: -2

class_spiral:
  pairs:
    - [
      # [0.375, 0.0],
      # [-0.375, 0.0]
      # the first in blue, the second in green
      # length = 0.75
      [0.25, 0.0],
      [0.0, -0.125]
    ]
    - [
      # [0.375, 0.25],
      # [0.375, -0.50] 
      # both blue
      [0.25, 0.0],
      [0.5, -0.125]
    ]
