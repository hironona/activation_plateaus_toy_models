n_points: 10000
radius: 1.0

# -2 for input space and -1 for embedding space, and non-negative integer for residual blocks.
# Collect resid_post activations after that layer. When -2 is given, the source space is the raw input space. When -1 is given, the source space is the post-embedding space. When a non-negative integer k is given, the source space is the activations after the layer k (resid_post).
source_layer_idx: -2
target_layer_idx: 'logits'
reference_point: [0.25, 0.0] # Of whose plateau to visualize. Necessary for L2_norm metric.
metric: "jacobian_norm_layerwise_prod"  # What metric to use to color each point in the source space, Options: ['l2_norm', 'jacobian_norm_layerwise_prod', 'jacobian_norm_full', 'jacobian_determinant_layerwise_prod', 'jacobian_determinant_full']
n_pca_components: 3  # Number of PCA components when source dim > this value. Options: 2 or 3
log_scale: True  # Whether to use log scale for the metric values when coloring the points

# Run directory (checkpoints/{task}/noise-{std}); results are averaged over every seed-* in it
checkpoint_dir: "checkpoints/class_spiral/noise-0.00"
